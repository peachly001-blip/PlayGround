<!doctype html>
<html lang="en">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#eef9f8;--muted:#9bb9c0;--gold:#edcf91;--panel:#102b3b;--line:#ffffff1a;--aqua:#63e0d0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',sans-serif;background:#061725;background-image:radial-gradient(ellipse at 48% 78%,#125364 0,transparent 42%),radial-gradient(ellipse at 10% 12%,#183750 0,transparent 36%),linear-gradient(135deg,#071827,#0b2538 52%,#091c2a);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(1px 1px at 15% 35%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 82% 18%,#b5fff4 50%,transparent 100%),radial-gradient(1px 1px at 73% 72%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 29% 82%,#7fe4db 50%,transparent 100%);background-size:230px 210px,300px 240px,190px 270px,360px 330px}
.shell{max-width:1180px;margin:auto;padding:28px 28px 22px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:37px;height:37px;border:1px solid #d5bd85aa;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px}.brandname{font:600 16px 'Playfair Display',serif;letter-spacing:.11em;text-transform:uppercase}.brandname small{display:block;color:#86a8b2;font:600 9px 'DM Sans';letter-spacing:.24em;margin-top:3px}.season{border:1px solid #ffffff25;border-radius:30px;padding:9px 14px;color:#b9d1d0;font-size:11px;letter-spacing:.09em;text-transform:uppercase}.season b{color:var(--gold);font-weight:600}
.heading{text-align:center;margin:0 auto 22px}.eyebrow{font-size:10px;letter-spacing:.28em;color:#8bded5;text-transform:uppercase}.heading h1{font:500 clamp(31px,4vw,47px) 'Playfair Display',serif;margin:7px 0 5px;letter-spacing:-.02em}.heading p{margin:0;color:#a6c1c5;font-size:13px}
.game{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);gap:20px;align-items:stretch;max-width:1030px;margin:auto}.stage{height:628px;position:relative;overflow:hidden;border:1px solid #b5e9e233;border-radius:17px;background:linear-gradient(180deg,#153b50d9 0%,#175465cc 61%,#0e3549e8 100%);box-shadow:0 24px 70px #0005,inset 0 0 60px #7cefe90c}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,#8ce9dc26,transparent 47%),linear-gradient(90deg,transparent 48%,#c2fff007 50%,transparent 52%);pointer-events:none}.stage:after{content:"";position:absolute;bottom:-80px;left:-10%;width:120%;height:160px;background:radial-gradient(ellipse,#061b2b 0%,#071c2a00 70%);pointer-events:none}.stage-label{position:absolute;top:17px;left:19px;z-index:3;font-size:9px;letter-spacing:.2em;color:#a5d4d1;text-transform:uppercase}.stage-label span{color:var(--gold);margin-left:8px}.stage-tools{position:absolute;top:12px;right:13px;z-index:5;display:flex;gap:7px}.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff38;background:#09283977;color:#d9f4ef;cursor:pointer;font-size:16px;transition:.2s}.iconbtn:hover{background:#ffffff24;transform:translateY(-2px)}.avatar{position:absolute;width:min(88%,440px);height:94%;left:50%;bottom:0;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 10px 24px #06141b75)}
.bubble{position:absolute;border:1px solid #c8fff24c;border-radius:50%;background:#c9fff10a;animation:rise 8s linear infinite;z-index:1}.b1{width:9px;height:9px;left:13%;bottom:3%;animation-delay:-2s}.b2{width:5px;height:5px;left:26%;bottom:20%;animation-delay:-5s}.b3{width:12px;height:12px;right:14%;bottom:6%;animation-delay:-1s}.b4{width:6px;height:6px;right:25%;bottom:25%;animation-delay:-6s}.b5{width:4px;height:4px;left:8%;bottom:42%;animation-delay:-3s}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-680px);opacity:0}}
.stage-caption{position:absolute;z-index:4;bottom:15px;left:0;right:0;text-align:center;color:#a8cfcc;font:italic 13px 'Playfair Display',serif;letter-spacing:.03em}
.dresser{border:1px solid #ffffff1b;border-radius:17px;background:linear-gradient(145deg,#102b3bee,#0c2535f5);box-shadow:0 24px 70px #0003;display:flex;flex-direction:column;min-height:628px;padding:21px 21px 17px}.panelhead{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px}.panelhead h2{font:500 25px 'Playfair Display',serif;margin:0 0 5px}.panelhead p{font-size:11px;color:#94b3bc;margin:0}.look-count{font-size:10px;color:#9eb8bd;border:1px solid #ffffff25;padding:6px 9px;border-radius:20px;white-space:nowrap}.look-count b{color:var(--gold)}
.challenge{display:flex;align-items:center;gap:12px;margin:15px 0 17px;padding:11px 12px;border:1px solid #e6ca8542;border-radius:10px;background:linear-gradient(100deg,#eacb8810,transparent)}.challenge-icon{font-size:19px}.challenge-copy{flex:1}.challenge-copy small{color:var(--gold);font-size:8px;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:3px}.challenge-copy strong{font:500 14px 'Playfair Display',serif}.challenge button{border:0;background:none;color:#b4d2d1;cursor:pointer;font-size:17px;padding:4px}.category-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}.tab{border:1px solid transparent;border-radius:8px;background:#ffffff08;color:#92adb4;padding:9px 3px 8px;cursor:pointer;font:500 10px 'DM Sans';transition:.18s}.tab span{display:block;font-size:17px;margin-bottom:4px}.tab:hover{color:#d8f6ef;background:#ffffff10}.tab.active{border-color:#72ded275;background:#50cbb31a;color:#a9f0e2}
.items-title{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#b8d0d1;margin:0 1px 9px}.items-title small{font-size:9px;letter-spacing:.03em;text-transform:none;color:#76979f}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:190px;align-content:start}.choice{position:relative;min-height:77px;border:1px solid #ffffff1a;border-radius:10px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);color:#c1d5d6;cursor:pointer;text-align:left;padding:10px 9px;transition:all .2s;overflow:hidden}.choice:hover{border-color:#8ce4d06b;transform:translateY(-2px);background:#ffffff0d}.choice.selected{border-color:#75e2d3;background:linear-gradient(145deg,#58d3bb21,#ffffff08);box-shadow:inset 0 0 0 1px #7ce4d124}.choice .emoji{font-size:21px;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 4px #0006)}.choice strong{display:block;font-size:10px;font-weight:600}.choice small{display:block;color:#7699a2;font-size:8px;margin-top:3px}.choice.selected:after{content:'✓';position:absolute;right:8px;top:7px;color:#8aebd8;font-size:11px}
.palette{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.palette label{color:#83a4aa;font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-right:auto}.swatch{width:21px;height:21px;border-radius:50%;border:2px solid #ffffff25;cursor:pointer;transition:.15s}.swatch:hover{transform:scale(1.13)}.swatch.active{outline:1px solid #d4eee5;outline-offset:2px}.actions{display:flex;gap:9px;margin-top:auto;padding-top:15px}.action{height:42px;border-radius:8px;cursor:pointer;font:600 10px 'DM Sans';letter-spacing:.06em;text-transform:uppercase;transition:.18s}.action:hover{transform:translateY(-1px);filter:brightness(1.12)}.save{flex:1;border:1px solid #edd496;background:linear-gradient(105deg,#d9ba78,#f1dba1);color:#253544}.random{width:44px;border:1px solid #ffffff2a;background:#ffffff0b;color:#d1e6e3;font-size:16px}.reset{width:44px;border:1px solid #ffffff2a;background:#ffffff0b;color:#b1c8c8;font-size:14px}
.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,20px);padding:11px 18px;border:1px solid #a9eddb66;background:#102e3bf2;color:#d9f8ec;border-radius:30px;font-size:12px;opacity:0;transition:.28s;pointer-events:none;box-shadow:0 8px 30px #0006}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{max-width:1030px;margin:15px auto 0;display:flex;justify-content:space-between;color:#71929b;font-size:9px;letter-spacing:.05em}.footer span:last-child{color:#8eaaa9}

</style>
